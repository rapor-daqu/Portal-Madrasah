function portalFrame(content){V.innerHTML=content+portalFooter()}
function portalAdminNav(){return `<div class="admin-menu"><a href="#santri">Data Santri</a><a href="#mapel">Mata Pelajaran</a><a href="#nilai">Input Nilai</a><a href="#raport">Cetak Raport</a><a href="#atur">Pengaturan</a><button class="logout-btn" id="portalLogout">Keluar</button></div>`}
function portalLogin(){
  document.querySelector('#nav').innerHTML=portalPublicNav;
  portalFrame(`<div class="login-wrap"><div class="login-card"><div class="eyebrow">Area terbatas</div><h2>Masuk Administrator</h2><p style="font-size:12px;color:#718078;line-height:1.8">Silakan masuk untuk mengelola data santri, nilai, mata pelajaran, dan raport.</p><form id="portalLoginForm"><label>Username</label><input name="username" autocomplete="username" required placeholder="Username admin"><label>Password</label><input name="password" type="password" autocomplete="current-password" required placeholder="Password"><button class="admin-primary" type="submit">Masuk ke Dashboard</button></form><div class="login-hint">Mode pratinjau lokal: username <b>admin</b> dan password <b>admin123</b>. Login ini belum aman untuk website publik. Autentikasi server akan dipasang setelah integrasi database.</div></div></div>`);
  document.querySelector('#portalLoginForm').onsubmit=e=>{e.preventDefault();const d=new FormData(e.target);if(d.get('username')==='admin'&&d.get('password')==='admin123'){portalAdminSession=true;sessionStorage.setItem('dq-admin-session','active');location.hash='#dashboard'}else alert('Username atau password tidak sesuai.')};
}
function portalHome(){
 document.querySelector('#nav').innerHTML=portalPublicNav;
 portalFrame(`<section class="hero"><div class="hero-inner"><div class="hero-kicker">Pendidikan · Adab · Al-Qur’an</div><h1>Membangun Generasi Qur’ani, Berilmu dan Berakhlak Mulia.</h1><p>Selamat datang di portal resmi MTSS PON-PES DARUL QUR’AN. Temukan informasi madrasah, kabar kegiatan, dan layanan pencarian data siswa dalam satu portal akademik.</p><div class="hero-actions"><a class="btn-gold" href="#cari">Cari Data Siswa&nbsp; →</a><a class="btn-outline" href="#tentang">Kenali Madrasah</a></div><div class="hero-stats"><div><strong>Qur’ani</strong><span>Berlandaskan Al-Qur’an</span></div><div><strong>Terpadu</strong><span>Ilmu dan pembinaan adab</span></div><div><strong>Unggul</strong><span>Generasi masa depan</span></div></div></div></section>
 <section class="portal-wrap-main"><div class="section-head"><div class="eyebrow">Jelajahi portal</div><h2>Layanan Informasi Madrasah</h2><p>Akses informasi publik dan layanan akademik yang tersedia untuk pengunjung.</p></div><div class="quick-grid"><article class="quick-card"><div class="quick-icon">⌕</div><h3>Pencarian Siswa</h3><p>Cari siswa berdasarkan nama dan lihat informasi dasar berupa jenis kelamin serta kelas.</p><a href="#cari">BUKA PENCARIAN →</a></article><article class="quick-card"><div class="quick-icon">▤</div><h3>Informasi Madrasah</h3><p>Baca pengumuman, agenda kegiatan, dan informasi terbaru dari madrasah.</p><a href="#informasi">LIHAT INFORMASI →</a></article><article class="quick-card"><div class="quick-icon">✧</div><h3>Tentang Kami</h3><p>Kenali profil, nilai pendidikan, dan lingkungan MTSS PON-PES DARUL QUR’AN.</p><a href="#tentang">KENALI MADRASAH →</a></article></div></section>
 <section class="public-band"><div class="portal-wrap-main"><div class="section-head"><div class="eyebrow">Kabar madrasah</div><h2>Informasi dan Pengumuman</h2><p>Informasi publik madrasah akan ditampilkan pada bagian ini.</p></div><div class="info-grid"><article class="info-card"><div class="date">PUSAT INFORMASI</div><h3>Pengumuman Madrasah</h3><p>Tempat informasi jadwal, agenda, dan pengumuman resmi untuk siswa serta wali santri.</p></article><article class="info-card"><div class="date">KEGIATAN</div><h3>Aktivitas Pendidikan</h3><p>Dokumentasi dan kabar kegiatan pembelajaran, keagamaan, serta pembinaan santri.</p></article></div></div></section>`);
}
function portalInfo(){document.querySelector('#nav').innerHTML=portalPublicNav;portalFrame(`<div class="portal-wrap-main"><div class="section-head"><div class="eyebrow">Pusat informasi</div><h2>Informasi & Pengumuman</h2><p>Informasi resmi MTSS PON-PES DARUL QUR’AN untuk siswa, wali santri, dan masyarakat.</p></div><div class="info-grid"><article class="info-card"><div class="date">PENGUMUMAN</div><h3>Pengumuman Madrasah</h3><p>Konten pengumuman dapat dikelola oleh administrator setelah sistem admin terhubung ke database.</p></article><article class="info-card"><div class="date">AGENDA</div><h3>Agenda Kegiatan</h3><p>Jadwal kegiatan dan agenda madrasah akan ditampilkan di halaman informasi ini.</p></article></div></div>`)}
function portalAbout(){document.querySelector('#nav').innerHTML=portalPublicNav;portalFrame(`<div class="portal-wrap-main"><div class="section-head"><div class="eyebrow">Tentang madrasah</div><h2>MTSS PON-PES DARUL QUR’AN</h2><p>Yayasan Islamic Centre Darul Qur’an · Pondok Pesantren Tahfizh</p></div><div class="about-panel"><h3 style="font:600 23px 'Source Serif 4';color:var(--p-green)">Pendidikan yang memadukan ilmu, Al-Qur’an, dan akhlak.</h3><p style="font-size:13px;line-height:2;color:#64736b">MTSS PON-PES DARUL QUR’AN merupakan lembaga pendidikan madrasah dan pesantren yang berkomitmen membina generasi berilmu, beradab, serta dekat dengan Al-Qur’an.</p><p style="font-size:12px;line-height:1.9;color:#64736b">Informasi profil rinci, visi, misi, sejarah, dan fasilitas dapat dilengkapi sesuai data resmi madrasah pada tahap finalisasi konten.</p></div></div>`)}
function portalSearch(){document.querySelector('#nav').innerHTML=portalPublicNav;portalFrame(`<div class="portal-wrap-main"><div class="search-shell"><div class="section-head"><div class="eyebrow">Layanan akademik publik</div><h2>Pencarian Data Siswa</h2><p>Masukkan nama siswa untuk melihat informasi dasar kelas.</p></div><div class="search-panel"><form class="search-form" id="portalSearchForm"><input id="portalSearchInput" type="search" placeholder="Ketik nama siswa..." autocomplete="off" aria-label="Cari nama siswa"><button type="submit">Cari Siswa</button></form><div class="search-note">Hasil pencarian publik hanya menampilkan nama, jenis kelamin, dan kelas. Nilai raport, absensi, dan data pribadi lainnya tidak ditampilkan.</div><div id="portalSearchResults" class="search-results"></div></div></div></div>`);
 document.querySelector('#portalSearchForm').onsubmit=e=>{e.preventDefault();const q=document.querySelector('#portalSearchInput').value.trim().toLocaleLowerCase('id');const out=document.querySelector('#portalSearchResults');if(q.length<2){out.innerHTML='<p class="search-note">Masukkan minimal 2 karakter nama siswa.</p>';return}const found=(S.santri||[]).filter(s=>(s.nama||'').toLocaleLowerCase('id').includes(q));out.innerHTML=found.length?found.map(s=>`<div class="student-result"><div><strong>${esc(s.nama||'')}</strong><small>Jenis kelamin: ${esc(s.jk||s.jenisKelamin||'Belum diisi')}</small></div><span class="class-pill">${esc(s.kelas||'Kelas belum ditentukan')}</span></div>`).join(''):'<p class="search-note">Data siswa tidak ditemukan.</p>'};
}
function portalDashboard(){
 document.querySelector('#nav').innerHTML=portalPublicNav;
 const count=(S.santri||[]).length, classes=kelasList().length;
 portalFrame(`<div class="admin-shell"><div class="admin-welcome"><div class="eyebrow" style="color:#e2c98e">Administrator</div><h2>Dashboard Pengelolaan Akademik</h2><p>Selamat datang. Kelola data siswa, mata pelajaran, nilai, dan raport madrasah dari area administrator.</p></div>${portalAdminNav()}<div class="quick-grid"><div class="quick-card"><div class="quick-icon">♙</div><h3>${count}</h3><p>Total data santri tersimpan di browser ini</p><a href="#santri">KELOLA DATA SANTRI →</a></div><div class="quick-card"><div class="quick-icon">▦</div><h3>${classes}</h3><p>Rombongan belajar terdaftar</p><a href="#santri">LIHAT KELAS →</a></div><div class="quick-card"><div class="quick-icon">▤</div><h3>${S.mapel.length}</h3><p>Mata pelajaran aktif</p><a href="#mapel">KELOLA MAPEL →</a></div></div></div>`);
 document.querySelector('#portalLogout').onclick=()=>{portalAdminSession=false;sessionStorage.removeItem('dq-admin-session');location.hash='#beranda'};
}
const portalOriginalRender=render;
render=function(){
 const route=(location.hash||'#beranda').slice(1);
 if(['beranda','informasi','tentang','cari','admin'].includes(route)){
  if(route==='beranda')return portalHome();
  if(route==='informasi')return portalInfo();
  if(route==='tentang')return portalAbout();
  if(route==='cari')return portalSearch();
  return portalLogin();
 }
 if(route==='dashboard'&&!portalAdminSession){location.hash='#admin';return}
 if(['santri','mapel','nilai','raport','atur','dashboard'].includes(route)){
  if(!portalAdminSession){location.hash='#admin';return}
  document.querySelector('#nav').innerHTML=portalPublicNav;
  if(route==='dashboard')return portalDashboard();
  portalOriginalRender();
  const adminBanner=document.createElement('div');adminBanner.className='admin-welcome';adminBanner.innerHTML=`<div class="eyebrow" style="color:#e2c98e">Area administrator</div><h2>Pengelolaan Akademik</h2><p>Data lengkap hanya tersedia setelah masuk sebagai admin.</p>`;
  const adminNav=document.createElement('div');adminNav.className='admin-shell';adminNav.style.paddingBottom='0';adminNav.innerHTML=portalAdminNav();
  V.insertBefore(adminBanner,V.firstChild);V.insertBefore(adminNav,V.children[1]||null);
  const logout=document.querySelector('#portalLogout');if(logout)logout.onclick=()=>{portalAdminSession=false;sessionStorage.removeItem('dq-admin-session');location.hash='#beranda'};
  return;
 }
 location.hash='#beranda';
};
window.addEventListener('hashchange',render);
render();
</script>
</body>
</html>
